# ============================================================
# 可选插件清单
# ------------------------------------------------------------
# 后期如需在镜像中增加软件，直接在 packages 下按 "- 包名" 添加，
# 重新运行构建工作流即可。留空则只构建基础系统。
#
# 示例：
#   packages:
#     - docker.io
#     - git
#     - vim
#
# 注意：
#   1. 插件在完整挂载的 chroot 中用 apt 安装，源为国内清华镜像。
#   2. 部分包的 postinst 会尝试启动服务；构建环境已放置 policy-rc.d
#      阻止服务启动，因此不会卡住构建。
#   3. 需要 systemd 开机自启的服务，请在镜像内自行 enable。
# ============================================================

packages: []
